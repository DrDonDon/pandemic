question: >
  What regularity conditions on the spatially varying anomalous diffusion exponents
  alpha(x) (space-fractional) and beta(x) (time-fractional) are necessary and sufficient
  for the CTRW scaling limit to converge weakly to a well-defined limiting process?

motivation: >
  Large-scale applied systems (biological tissue, heterogeneous porous media, financial
  microstructure) exhibit anomalous diffusion whose character changes across space.
  The CTRW is the natural microscopic model. Without knowing when the macroscopic
  (PDE) limit is valid, numerical simulations and parameter inference for these systems
  rest on unverified foundations. Researcher has background with Angstman group (UNSW)
  on CTRW and fractional Fokker-Planck.

current_focus: "C1 — necessity direction (step-function counterexample first)"
weeks_on_current_thread: 0

# ── CONJECTURES ────────────────────────────────────────────────────────────────
open_conjectures:
  - id: C1
    statement: >
      Let alpha, beta: R -> (0,2) x (0,1) be measurable and bounded away from 0 and 2
      (resp. 0 and 1). The rescaled CTRW X^epsilon converges weakly in D([0,T], R)
      if and only if alpha and beta are continuous.
    precision: formalised
    trivial_cases_checked: true
    stepping_stone: "S1: show step-function alpha causes non-convergence (necessity direction)"
    evidence_for:
      - "Constant-exponent case: Meerschaert-Scheffler (2004) — converges. Baseline."
      - "Linear alpha(x): local parameter variation O(eps^{1/alpha}) -> 0 in scaling limit"
      - "Umarov-Steinberg (2009): piecewise-constant order causes interface issues on PDE side"
    evidence_against: []
    next_step: "Run /literature-scout then /counterexample on S1 (step-function case)"
    weeks_active: 0

proved: []

disproved: []

# ── LITERATURE ─────────────────────────────────────────────────────────────────
adjacent_results:
  - citation: "Meerschaert & Scheffler (2004), Limit theorems for continuous-time random walks"
    what_they_proved: "CTRW with constant alpha, beta converges weakly to time-changed alpha-stable Levy process"
    how_it_relates: "prerequisite — the constant-exponent baseline result"
    gap: "Does not address variable exponents"

  - citation: "Samko (1995), Fractional integration and differentiation of variable order"
    what_they_proved: "Variable-order fractional operators are well-defined as pseudo-differential operators when the order function is C-infinity"
    how_it_relates: "relevant to sufficiency direction — PDE side requires alpha in C^0 minimum"
    gap: "Smooth order function only; C^0 and Holder cases not treated"

  - citation: "Umarov & Steinberg (2009), Variable order differential equations with piecewise constant order-function"
    what_they_proved: "Variable-order diffusion with piecewise-constant order has issues at discontinuity interfaces"
    how_it_relates: "partial evidence for necessity — discontinuous order causes problems on PDE side"
    gap: "PDE side only; does not address CTRW convergence directly"

  - citation: "Chechkin, Gorenflo & Sokolov (2005), Fractional diffusion in inhomogeneous media"
    what_they_proved: "Fractional diffusion with spatially varying order derived heuristically from CTRW"
    how_it_relates: "motivating paper for the CTRW -> PDE connection"
    gap: "Heuristic only; no rigorous Skorokhod convergence theorem"

  - citation: "Fedotov & Falconer (2012), Subdiffusive master equation with space-dependent anomalous exponent"
    what_they_proved: "Master equation for CTRW with space-dependent beta(x) — formal derivation"
    how_it_relates: "closest to our setting but time-fractional only, not space-fractional"
    gap: "Formal derivation only. Space-fractional alpha(x) not treated."

