question: >
  What regularity conditions on the spatially varying anomalous diffusion exponents
  alpha(x) (space-fractional) and beta(x) (time-fractional) are necessary and sufficient
  for the CTRW scaling limit to converge weakly to a well-defined limiting process?

motivation: >
  Large-scale applied systems (biological tissue, heterogeneous porous media, financial
  microstructure) exhibit anomalous diffusion whose character changes across space.
  The CTRW is the natural microscopic model. Without knowing when the macroscopic
  (PDE) limit is valid, numerical simulations and parameter inference for these systems
  rest on unverified foundations. Researcher has background with Angstman group (UNSW)
  on CTRW and fractional Fokker-Planck.

current_focus: "C1 — necessity direction (step-function counterexample first)"
weeks_on_current_thread: 0

# ── CONJECTURES ────────────────────────────────────────────────────────────────
open_conjectures:
  - id: C1
    statement: >
      REVISED (2026-04-05): Let alpha, beta: R -> (0,2) x (0,1) be measurable and bounded
      away from 0 and their maxima. The rescaled CTRW X^epsilon converges weakly in D([0,T],R)
      to a process whose density satisfies the variable-order fractional diffusion equation
      d_t^{beta(x)} u = -(-Delta)^{alpha(x)/2} u  if and only if alpha and beta are continuous.
      [Original "iff weak convergence" is likely wrong — step-function CTRW probably does
      converge weakly under alpha_1-scaling, but to a scale mixture, not the variable-order PDE.]
    precision: formalised
    trivial_cases_checked: true
    stepping_stone: "S1: show step-function alpha gives limit that is a scale mixture of alpha_1-stables, not a variable-order PDE solution"
    evidence_for:
      - "Constant-exponent case: Meerschaert-Scheffler (2004) — converges. Baseline."
      - "Linear alpha(x): local parameter variation O(eps^{1/alpha}) -> 0 in scaling limit"
      - "Umarov-Steinberg (2009): piecewise-constant order causes interface issues on PDE side"
      - "Numerical (2026-04-05): step-function alpha1=1.2/alpha2=1.8 produces asymmetric tails — consistent with scale mixture of alpha_1-stables, not pure stable law"
      - "Derive S1 (2026-04-05): alpha_2 contribution vanishes under n^{1/alpha_1} scaling (Lemma 1, proved). Scale mixture structure established modulo occupation time gap (G1-G2)."
      - "Derive sufficiency (2026-04-05): generator convergence complete (Steps 1-4). Continuity of alpha enters in Prop 2 (equicontinuity bound omega_alpha(delta)->0). Tightness and limit-point identification complete. Gap: uniqueness of martingale problem for -(-Delta)^{alpha(x)/2}. Sharp threshold likely Dini-continuous."
    evidence_against:
      - "Step-function CTRW likely DOES converge weakly (under alpha_1-scaling) — falsifies original 'iff weak convergence' formulation. Revised to 'iff PDE characterisation holds'."
    next_step: "Two open gaps remain: (1) S1 gap G1-G2: occupation time law for asymmetric stable walk — Bingham (1973) extension. (2) Sufficiency gap: well-posedness of martingale problem for -(-Delta)^{alpha(x)/2} with alpha in C^0. Sharp threshold likely Dini-continuous, not merely C^0. Open a new conjecture C2 on the sharp threshold."
    weeks_active: 0

