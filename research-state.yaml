# ── LITERATURE ─────────────────────────────────────────────────────────────────
adjacent_results:
  - citation: "Straka (2018), Physica A 503:451-463, arXiv:1712.06767"
    what_they_proved: "VOFFPEs with position-dependent beta(x) rigorously derived as governing equations of scaling limits of spatially inhomogeneous CTRWs, via weak convergence of bivariate Langevin process"
    assumptions: "beta(x) in (0,1) spatially varying; drift/diffusion coefficients smooth enough for Langevin SDE. Exact regularity threshold on beta(x) not stated as a theorem."
    how_it_relates: "proves sufficiency direction of C1 for beta(x) (time-fractional only) — CLOSEST PAPER"
    gap: "Space-fractional alpha(x) not treated. Necessity direction (discontinuous beta fails) not addressed. Sharp regularity threshold on beta(x) not identified."

  - citation: "Meerschaert & Straka (2014), Ann. Prob. 42(4):1699-1723, arXiv:1206.1960"
    what_they_proved: "General semi-Markov framework for CTRW limits with coupled space-time dependent parameters; rigorous weak convergence in Skorokhod J1; explicit transition kernels"
    assumptions: "Heavy-tailed waiting times; space-time dependent coupling allowed"
    how_it_relates: "general framework accommodating spatially varying parameters; regularity threshold not the focus"
    gap: "Sharp regularity threshold for spatial variation not identified. Necessity direction not addressed."

  - citation: "Meerschaert & Scheffler (2008), Stoch. Proc. Appl. 118:1606-1633"
    what_they_proved: "Triangular array functional limit theorems for CTRWs; limit is Levy process time-changed by subordinator; densities solve space-time fractional diffusion equations"
    assumptions: "Constant exponents; power-law tails"
    how_it_relates: "foundational constant-exponent baseline; proof template for C1 via localisation"
    gap: "Does not address variable exponents"

  - citation: "Wang & Zheng (2019), J. Math. Anal. Appl. 475:1778-1802"
    what_they_proved: "Well-posedness of variable-order time-fractional diffusion PDEs; regularity depends on behavior of order function at t=0, not on spatial smoothness of alpha(x)"
    assumptions: "Variable order in time; bounded spatial domain"
    how_it_relates: "PDE-side evidence that temporal and spatial regularity requirements may decouple — relevant to whether alpha and beta conditions in C1 are independent"
    gap: "PDE side only; no CTRW convergence. Space-fractional not treated."

  - citation: "Fedotov & Falconer (2012), Phys. Rev. E 85:031132"
    what_they_proved: "Structural instability of constant-exponent FFPE under small spatial variation in mu(x); anomalous aggregation replaces Gibbs-Boltzmann equilibrium"
    assumptions: "CTRW on lattice with power-law waiting times, position-dependent exponent; external potential present"
    how_it_relates: "indirect evidence for necessity — discontinuous/rapidly varying beta causes qualitative failure. Master equation derivation heuristic, not Skorokhod convergence."
    gap: "Heuristic CTRW->PDE derivation. Space-fractional alpha(x) not treated. Necessity not proved."

  - citation: "Gorenflo & Mainardi (2007), arXiv:0705.0797"
    what_they_proved: "Rigorous Fourier-Laplace equivalence between power-law waiting-time CTRW and time-fractional diffusion equation; Mittag-Leffler universality"
    assumptions: "Constant exponents; 1D; spatially homogeneous"
    how_it_relates: "foundational; Fourier-Laplace approach may extend to variable exponents near a fixed point"
    gap: "Constant exponents only"

  - citation: "Chechkin, Gorenflo & Sokolov (2005), J. Phys. A 38:L679"
    what_they_proved: "Heuristic derivation of fractional diffusion equation with spatially varying order from CTRW; two-region composite model with different exponents in each half-space"
    assumptions: "Two-region piecewise-constant exponent; heuristic scaling argument"
    how_it_relates: "directly models the step-function case of C1-S1 — but without rigorous convergence. Their two-region model is exactly the counterexample target."
    gap: "Heuristic only. Does not prove or disprove convergence at the interface."

